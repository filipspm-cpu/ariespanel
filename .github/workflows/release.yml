name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: Kanał wydania na GitHubie
        type: choice
        options:
          - stable
          - beta
        default: stable

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Align GitHub publish target
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || '' }}
          ARIES_UPDATES_REPOSITORY: filipspm-cpu/ariespanel
        run: node scripts/align-publish-target.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run electron:build
      - name: Keep installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/ARIES-Setup-*.exe
            release/ARIES-Setup-*.exe.blockmap
            release/*.yml
            strona/upd/**
          if-no-files-found: error
          retention-days: 5
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARIES_UPDATES_REPOSITORY: filipspm-cpu/ariespanel
        run: node scripts/publish-github-release.js
      - name: Label GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARIES_UPDATES_REPOSITORY: filipspm-cpu/ariespanel
        run: node scripts/label-github-release.js
