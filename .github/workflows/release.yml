name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align GitHub publish target
        run: node -e "const fs=require('fs'); const [owner,repo]=process.env.GITHUB_REPOSITORY.split('/'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.repository={type:'git',url:`https://github.com/${owner}/${repo}.git`}; pkg.build.publish.owner=owner; pkg.build.publish.repo=repo; fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
