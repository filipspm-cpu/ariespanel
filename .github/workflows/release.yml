name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: Kanał wydania na GitHubie
        type: choice
        options:
          - stable
          - beta
        default: stable

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align GitHub publish target
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || '' }}
        run: node scripts/align-publish-target.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release
