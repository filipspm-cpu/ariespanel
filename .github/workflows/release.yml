name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: Kanał wydania na GitHubie
        type: choice
        options:
          - stable
          - beta
        default: stable

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align GitHub publish target
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || '' }}
        run: node scripts/align-publish-target.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Restore Windows code-signing certificate
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK_B64) { throw "Brak secrets.CSC_LINK — podpis Authenticode jest wymagany." }
          if (-not $env:CSC_KEY_PASSWORD) { throw "Brak secrets.CSC_KEY_PASSWORD." }
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\build\aries-codesign.pfx", [Convert]::FromBase64String($env:CSC_LINK_B64))
          Set-Content -Path "$env:GITHUB_WORKSPACE\build\aries-codesign.password" -Value $env:CSC_KEY_PASSWORD -NoNewline
      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ github.workspace }}\build\aries-codesign.pfx
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release
