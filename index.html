<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARIES</title>
    <style>
      html, body { height: 100%; margin: 0; background: #09090b; overflow: hidden; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 90;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 38%, #161616 0%, #050505 68%);
        color: #fff; font-family: Inter, Segoe UI, sans-serif;
      }
      #boot-splash.is-hidden { opacity: 0; pointer-events: none; transition: opacity .35s ease; }
      #boot-splash .w { letter-spacing: .42em; font-size: 28px; padding-left: .42em; }
      #boot-splash .k { margin-top: 8px; letter-spacing: .46em; font-size: 10px; color: #737373; padding-left: .46em; }
      #boot-splash .b { margin-top: 28px; width: 168px; height: 3px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
      #boot-splash .b i { display: block; width: 42%; height: 100%; background: #fff; border-radius: 99px; animation: s 1.05s ease-in-out infinite; }
      #boot-splash .c { margin-top: 14px; font-size: 12px; letter-spacing: .18em; color: #8a8a8a; text-transform: uppercase; }
      @keyframes s { from { transform: translateX(-120%); } to { transform: translateX(280%); } }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="w">ARIES</div>
      <div class="k">PANEL</div>
      <div class="b"><i></i></div>
      <div class="c">Ładowanie…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
